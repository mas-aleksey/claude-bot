name: claude-bot

# This file only builds the base image. Instances — the assistant and project sandboxes —
# live in compose files of their own: each with its own .env, volumes and environment.
# An example instance is in the README, section "Running it".
#
# The service never starts (`profiles`); its job is to give `docker compose build` the
# claude-bot:latest image that instances then stack their own layers on.

services:
  claude-bot-base:
    build: .
    image: claude-bot:latest
    profiles: ["build"]                 # never comes up with the rest, only builds
