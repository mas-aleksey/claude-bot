name: claude-bot

# Здесь только сборка базового образа. Инстансы — ассистент и песочницы проектов —
# живут своими compose-файлами: у каждого свой .env, свои тома и своё окружение.
# Пример инстанса — в README, раздел «Running it».
#
# Сервис не запускается (`profiles`), его задача — дать `docker compose build`
# образ claude-bot:latest, поверх которого инстансы ставят свои слои.

services:
  claude-bot-base:
    build: .
    image: claude-bot:latest
    profiles: ["build"]                 # не поднимается вместе с остальными, только собирается
