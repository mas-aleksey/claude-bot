[project]
name = "claude-bot"
version = "0.1.0"
description = "Claude Code on the home server, driven from Telegram."
requires-python = ">=3.14"
dependencies = [
    "aiogram>=3.13",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
sources = ["src"]
# Flat modules, no packages — see "Состав сервиса" in docs/bot.md.
# All of src/, not a list of files: a module forgotten in such a list drops the bot into a
# restart loop on the server (ModuleNotFoundError at runtime, with a green build).
only-include = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
# ASYNC109/230/240 are about trio/anyio: one is_dir() and one log line are not worth the dependency.
ignore = ["E501", "RUF001", "RUF002", "RUF003", "ASYNC109", "ASYNC230", "ASYNC240"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
