# System-wide tmux config, read before ~/.tmux.conf. Here rather than in /root: that path
# is covered by the ${USER_DATA}/root mount, and anything the image puts there disappears.

# Mouse off, and that is the whole point: with it on tmux requests mouse reporting, every
# drag goes to tmux instead of the browser, and the highlight vanishes on mouse-up because
# tmux has taken the text into its own buffer. The text was never lost — but getting it out
# took a button, and selecting felt broken. Four rounds of that was enough (2026-10-01).
#
# Off, selection is the browser's again: drag selects, Cmd+C copies, right-click offers
# Copy. Exactly what every other terminal in a browser does, with nothing to explain.
#
# The modifier that hands the drag back while mouse is on (Shift elsewhere, Option on macOS
# with ttyd's `-t macOptionClickForcesSelection=true`) did not work in Safari, so it is not
# an answer either.
#
# What this costs: tmux holds the alternate screen, so the terminal's own scrollback stays
# empty and the wheel scrolls nothing. History is still there — `C-b [` enters copy mode,
# arrows and PgUp walk it. Put `set -g mouse on` back if the wheel turns out to matter more.
set -g mouse off

# 2000 lines is one build log. Twenty thousand costs a few megabytes per pane and covers
# the case the scrollback exists for: reading what scrolled past while you were away.
set -g history-limit 20000
