# System-wide tmux config, read before ~/.tmux.conf. Here rather than in /root: that path
# is covered by the ${USER_DATA}/root mount, and anything the image puts there disappears.

# The browser terminal runs inside tmux, and tmux holds the alternate screen — so the
# terminal's own scrollback stays empty and the wheel does nothing. With mouse on, the
# wheel enters copy mode and scrolls tmux's history instead.
# Trade-off: selecting text with the mouse now goes to tmux's buffer, not the browser's.
# Hold Shift while selecting to get the browser selection back.
set -g mouse on

# 2000 lines is one build log. Twenty thousand costs a few megabytes per pane and covers
# the case the scrollback exists for: reading what scrolled past while you were away.
set -g history-limit 20000
