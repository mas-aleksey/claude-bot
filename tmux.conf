# System-wide tmux config, read before ~/.tmux.conf. Here rather than in /root: that path
# is covered by the ${USER_DATA}/root mount, and anything the image puts there disappears.
#
# The browser terminal no longer runs tmux — it runs dtach, for the reasons written out in
# entrypoint.sh. This file is still live for anyone who starts tmux by hand over ssh, and
# the mouse trade below is still the same trade there.

# Mouse off by default, and switchable with `C-b m`. The switch has been flipped both ways
# now, so both sides are written down — the next person to touch this should see the whole
# trade, not just the state it is in.
#
# Off, tmux never asks the terminal for mouse reporting. A drag stays the browser's: select,
# Cmd+C, right-click Copy — exactly what every other terminal in a browser does. The cost is
# the wheel: tmux holds the alternate screen, so xterm.js has no scrollback of its own, and
# a wheel event in the alternate screen arrives as arrow keys. In bash that is readline
# walking previous commands — the terminal looks like its scrollback broke.
#
# On, the wheel scrolls tmux history, and the drag goes to tmux instead of the browser. The
# highlight vanishes on mouse-up because tmux takes the text into its own buffer. The
# modifier that hands the drag back (Shift elsewhere, Option on macOS with ttyd's
# `-t macOptionClickForcesSelection=true`, set in entrypoint.sh) does not work in Safari.
#
# `set-clipboard on` was meant to make `on` survivable: on mouse-up tmux copies the selection
# and emits OSC 52 for xterm.js to put in the system clipboard. In Safari it does not arrive —
# checked 2026-10-13, copying broke the moment the mouse went on. Kept anyway: it costs
# nothing and does work in Chrome. Default is `external`, which only forwards OSC 52 coming
# from programs inside tmux and would leave tmux's own copy stuck in its buffer.
set -g mouse off
set -g set-clipboard on

# Since OSC 52 does not reach Safari, neither side of the trade can be settled once: the
# wheel and the selection are both needed, and which one wins depends on what is being done
# right now. So it is a switch rather than a decision.
#
# `C-b m` flips it. Значение у `set` опущено намеренно: у флаговых опций tmux это
# переключение, а не ошибка, — поэтому одна строка вместо двух биндов и своего состояния.
# Сообщение внизу нужно: без него непонятно, в какую сторону только что щёлкнуло.
bind m set -g mouse \; display-message "mouse #{?mouse,on — колесо листает историю,off — выделение и копирование браузерные}"

# 2000 lines is one build log. Twenty thousand costs a few megabytes per pane and covers
# the case the scrollback exists for: reading what scrolled past while you were away.
set -g history-limit 20000
