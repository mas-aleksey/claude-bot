name: claude-example

# A project sandbox: the bot plus its own docker daemon (DinD). The host's daemon is
# invisible from inside, so builds and tests of a work repository cannot touch anything
# running next door.
#
# An sshd lives in the bot container too: attach from PyCharm / VSCode Remote and you get
# the same working tree, the same daemon and the same claude session folder the bot uses.
# A session started in the IDE continues in Telegram and back.
#
# Copy this directory per project. Variables live in ./.env — USER_DATA and CLAUDE_BOT are
# absolute paths on purpose, so the file can be moved without rewriting them.
#
# Service names carry the project prefix. If you pull several of these into one root
# compose with `include`, everything merges into a single project and the `name:` above is
# ignored — a bare `bot`/`dind` would collide with the next sandbox. Copying this under a
# new project means changing the prefix.

services:
  example-bot:
    build: .
    image: claude-example:latest
    container_name: claude-example
    depends_on: [example-dind]
    # A shared network namespace with dind: ports published by sandbox containers show up
    # on the bot's localhost, while 2375 never reaches the compose network. The price: the
    # bot has no name of its own in DNS (nothing ever connects to it), and restarting dind
    # tears down the netns — the bot has to be restarted after it. The sshd port is
    # published on dind rather than here, because the bot has no network stack of its own.
    network_mode: "service:example-dind"
    init: true                                  # reaps claude's children after /cancel, and the sshd fork
    working_dir: /projects
    env_file: .env
    environment:
      DOCKER_HOST: tcp://localhost:2375         # instead of docker.sock; the netns is shared with dind
    volumes:
      # All of /root, not individual files: besides .claude and .claude.json this holds the
      # IDE backends (JetBrains ~1 GB, vscode-server ~150 MB) — without persistence they
      # download again after every recreate. The directory is named root, not home: it is
      # exactly /root, and looking at it from the host you want to see the same name.
      - ${USER_DATA}/root:/root
      # .ssh separately from ${USER_DATA}/root, but rw: ssh does not update known_hosts in
      # place, it goes through mkstemp in the same folder — with :ro every git command would
      # spit `hostfile_replace_entries: Read-only file system`, and a new remote could not be
      # added from inside. The key sits at 0400, but that is only a "do not touch" label: the
      # process runs as root and `echo > id_rsa` walks straight past the mode. The real
      # protection here is a copy of the key on the host, not the file's permissions.
      - ${USER_DATA}/ssh:/root/.ssh             # key for git remotes + authorized_keys for logins
      - ${USER_DATA}/sshd:/etc/ssh/keys:ro      # host keys: the fingerprint survives a recreate
      - ${USER_DATA}/projects:/projects         # work repositories; same path as in dind
      - ${USER_DATA}/data:/data                 # bot.db, audit.log — state next to the credentials
      # Skills: claude-code reads only /root/.claude/skills, and there are two sources here —
      # claude-bot's base set and this project's. Both are mounted in, and entrypoint links
      # them one by one (mounting a folder over a folder would hide all but the last). The
      # numeric prefix sets priority: 20-project overrides 10-base.
      # rw, not ro: claude edits and creates skills itself from inside — this is a working
      # tool, not a config. Edits land straight in the repository on the host, and go into
      # git as an ordinary commit.
      - ${CLAUDE_BOT}/claude/skills:/opt/skills/10-base
      - ./skills:/opt/skills/20-project
      # CLAUDE.md — the sandbox environment, nothing else. The answer style is an output
      # style baked into the image and selected by --settings, so it is not mounted here.
      - ${CLAUDE_BOT}/claude/CLAUDE.md:/root/.claude/CLAUDE.md:ro
    restart: unless-stopped

  example-dind:
    image: docker:28-dind
    container_name: claude-example-dind
    privileged: true                            # unavoidable for DinD
    environment:
      DOCKER_TLS_CERTDIR: ""                    # TLS off — 2375 never leaves the netns
    command: ["--host=tcp://0.0.0.0:2375"]
    # sshd listens inside the bot container, but the netns is shared — the port has to be
    # published here. 127.0.0.1: reachable from outside only via `ssh -J user@<server>`,
    # never exposed on the LAN. One port per sandbox, so bump it for the next one.
    ports:
      - "127.0.0.1:2222:22"
    volumes:
      - ${USER_DATA}/dind:/var/lib/docker       # the sandbox's images, separate from the host's
      # The same path as in the bot — otherwise `docker run -v /projects/x:/app` mounts
      # nothing: paths in -v are resolved by the daemon, not by the client.
      - ${USER_DATA}/projects:/projects
    restart: unless-stopped

  # A VPN tunnel to the project's infrastructure — uncomment if the sandbox needs to reach
  # something that is not on the public internet. A separate container, not a process
  # inside the bot, and that choice is the whole design:
  #
  #   - the netns is dind's, so a tunnel raised here is the bot's tunnel too — the routes
  #     and DNS land in the namespace all three containers share;
  #   - NET_ADMIN and /dev/net/tun stay off the container that runs claude as root with
  #     permission checks bypassed;
  #   - `restart: unless-stopped` restarts a tunnel that dropped. A tunnel started from
  #     the bot's entrypoint comes up once and stays down after it dies;
  #   - the protocol lives here, not in the shared entrypoint. A WireGuard sandbox swaps
  #     `image` and the config mount and keeps the rest of this block as it is.
  #
  # cap_add is required: unlike dind next door, this container is not privileged.
  # /dev/net/tun needs no modprobe on a stock Debian/Ubuntu host — CONFIG_TUN=y, the
  # device is already there. Check with `ls /dev/net/tun` before debugging anything else.
  #
  # The config carries credentials and never goes into an image or into git: it sits in
  # ${USER_DATA}/vpn on the host, next to the rest of the instance's secrets, and the
  # filename comes from .env so this file names no particular network.
  #
  # KILL_SWITCH (default `on`) is a decision, not a detail. It blocks everything in the
  # shared namespace that is not the tunnel — and that namespace also carries the bot's
  # Telegram long-poll and the published sshd port, so a dropped tunnel takes the whole
  # sandbox offline with it. Which of the two you want depends on the config:
  #   - the .ovpn has `redirect-gateway` (all traffic goes through the VPN) — keep it on,
  #     and list the LAN in SUBNETS so ssh survives;
  #   - the .ovpn only pushes routes to a few private subnets — turn it off. There is no
  #     leak to prevent, and an outage of the tunnel should not cost you the bot.
  #
  # Reality check on what the tunnel covers: the bot and dind see it, containers that dind
  # *starts* do not — each of those gets a netns of its own. Builds and tests that have to
  # reach a private address need `--network host` against the sandbox daemon, or their own
  # route. Worth knowing before wondering why a passing curl fails inside a test.
  #
  # example-vpn:
  #   image: ghcr.io/wfg/openvpn-client:3.1    # pin the minor and check the interface first:
  #                                            # the README on master documents CONFIG_FILE
  #                                            # and /config, which no published tag speaks
  #                                            # yet — 3, 3.1, latest all share one digest
  #                                            # and want VPN_CONFIG_FILE with /data/vpn
  #   container_name: claude-example-vpn
  #   network_mode: "service:example-dind"     # same namespace as the bot — that is the point
  #   cap_add: [NET_ADMIN]
  #   devices:
  #     - /dev/net/tun:/dev/net/tun
  #   volumes:
  #     # /data/vpn, not /config: the image has WORKDIR=/data and resolves the config as
  #     # `vpn/$VPN_CONFIG_FILE` relative to it. rw, not ro — openvpn writes a modified
  #     # copy of the config next to the original. The .ovpn goes here, and if it has no
  #     # credentials baked in, a `credentials.txt` (username on line one, password on
  #     # line two) beside it, referenced from the config as `auth-user-pass credentials.txt`.
  #     - ${USER_DATA}/vpn:/data/vpn
  #   environment:
  #     VPN_CONFIG_FILE: ${VPN_CONFIG}         # filename inside /data/vpn; unset picks a
  #                                            # random *.ovpn/*.conf found there
  #     KILL_SWITCH: "off"                     # see the note above — depends on the config
  #     # SUBNETS: <your LAN in CIDR>          # only with the kill switch on: the LAN, so
  #                                            # the published sshd port stays reachable
  #   restart: unless-stopped
