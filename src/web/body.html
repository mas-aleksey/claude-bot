</head><body>
<div id=top>
<aside>
  <input id=find type=search placeholder="поиск по сессиям">
  <div id=list></div>
  <div id=plan hidden></div>
</aside>
<button id=fold title="список сессий" aria-label="скрыть или показать список сессий"></button>
<div id=panes><div id=empty>
  <button class=list>список сессий</button>
</div></div>
<button id=rfold title="дерево файлов" aria-label="скрыть или показать дерево файлов"></button>
<aside class=files>
  <select id=root title="корень дерева"></select>
  <div class=row>
    <button class=new id=newfile title="создать файл в открытом каталоге">+ файл</button>
    <button class=new id=newdir title="создать папку в открытом каталоге">+ папка</button>
    <!-- Значок символом, а не escape-последовательностью: это статическая разметка, а не
         шаблонная строка JS, и `\u21bb` тут осталось бы текстом. -->
    <button class="new rescan" id=rescan title="перечитать каталог">↻</button>
  </div>
  <div id=crumb></div>
  <div id=tree></div>
</aside>
</div>
<button id=termbar title="терминал: клик открывает и закрывает, потянуть — высота"
  aria-label="терминал"></button>
<!-- Шторка: терминал или общий браузер. Строка вкладок появляется, только когда браузер
     есть (`/api/browser/tabs` ответил), иначе шторка — тот же терминал, что и раньше. -->
<div id=term>
  <div id=drawtabs hidden>
    <button id=dt-term class=on>терминал</button><button id=dt-br>браузер</button>
    <span id=brbar>
      <button id=brback title="назад">←</button><button id=brreload title="обновить">↻</button>
      <input id=brurl placeholder="адрес" autocomplete=off spellcheck=false>
      <select id=brtabs title="вкладка"></select><button id=brnew title="новая вкладка">+</button><button id=brx title="закрыть вкладку">×</button>
      <button id=brkbd title="клавиатура">⌨</button><button id=brfull title="на весь экран">⤢</button>
    </span>
  </div>
  <button id=tpaste title="вставить из буфера в терминал">вставить</button>
  <div id=bview hidden><canvas id=brcanvas></canvas>
    <textarea id=brinput aria-label="ввод в браузер" autocomplete=off autocapitalize=off spellcheck=false></textarea>
    <div id=brsay></div></div>
</div>
<div id=dead hidden>бот не отвечает или кончилась сессия входа
  <button id=reload>обновить страницу</button></div>
<!-- Вход по подписке. Своё окно, а не `prompt()`: в нём ссылка — ссылка, по ней можно
     нажать. В браузерном диалоге она была текстом на триста символов, который оставалось
     только выделять руками. -->
<dialog id=auth>
  <p>Открой ссылку, войди в Claude и вставь сюда код.</p>
  <a id=authurl target=_blank rel=noopener>открыть вход в Claude</a>
  <input id=authcode placeholder="код из браузера" autocomplete=off>
  <div class=row>
    <span id=authsay></span>
    <button id=authno>отмена</button>
    <button id=authok>войти</button>
  </div>
</dialog>
<!-- Вход по ключу API: любой прокси с API Anthropic — свой пул, TeamClaude, сам
     api.anthropic.com. Ключ проверяется сервером до записи. -->
<dialog id=keydlg>
  <p>Ключ API вместо подписки. Действует со следующего запроса, и для бота тоже.</p>
  <input id=keyurl placeholder="адрес, пусто — https://api.anthropic.com" autocomplete=off>
  <input id=keyval type=password placeholder="ключ" autocomplete=off>
  <textarea id=keyhdr rows=2 placeholder="заголовки, если нужны: Имя: значение"></textarea>
  <div class=row>
    <span id=keysay></span>
    <button id=keyno>отмена</button>
    <button id=keyok>подключить</button>
  </div>
</dialog>
